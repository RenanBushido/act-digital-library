# Exemplo com placeholders. NUNCA versionar um secret.yaml com valores reais -
# copie este arquivo para secret.yaml (ignorado pelo git) e substitua os placeholders,
# ou gere o Secret por outro meio (Sealed Secrets, External Secrets, etc.) antes de aplicar.
apiVersion: v1
kind: Secret
metadata:
  name: library-api-secrets
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=CHANGE_ME;Port=5432;Database=library;Username=CHANGE_ME;Password=CHANGE_ME"
  ConnectionStrings__Redis: "CHANGE_ME:6379"
