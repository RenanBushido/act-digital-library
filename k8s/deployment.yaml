apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: library-api
  template:
    metadata:
      labels:
        app: library-api
    spec:
      # Alinhado ao ShutdownTimeout padrão da aplicação (30s): dá tempo do processo
      # drenar requisições em andamento antes do SIGKILL.
      terminationGracePeriodSeconds: 30
      containers:
        - name: library-api
          image: library-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: library-api-config
            - secretRef:
                name: library-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
