services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: library
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.1-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Coletor OTLP + UI para traces e métricas. Teste.
  otel:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports: ["18888:18888", "4317:18889"]

  # ---- Serviços da aplicação: só sobem com --profile app (precisam do Dockerfile)
  migrator:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Library.Api/Dockerfile
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=library;Username=library;Password=${POSTGRES_PASSWORD:-localdev}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/Library.Api/Dockerfile
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORT: "8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=library;Username=library;Password=${POSTGRES_PASSWORD:-localdev}"
      ConnectionStrings__Redis: "redis:6379"
      OTEL_EXPORTER__OTLP__ENDPOINT: "http://otel:4317"
      OTEL_SERVICE_NAME: "library-api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata: